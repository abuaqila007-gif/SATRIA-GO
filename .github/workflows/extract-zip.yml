
name: Extract SATRIA GO ZIP

on:
  push:
    paths:
      - 'SATRIA_GO_PLAIN_NO_PASSWORD.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o SATRIA_GO_PLAIN_NO_PASSWORD.zip -d .
          rm SATRIA_GO_PLAIN_NO_PASSWORD.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Install SATRIA GO admin and registration"
          git push
