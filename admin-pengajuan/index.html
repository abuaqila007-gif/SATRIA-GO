<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#b51220">
<title>Admin Pengajuan Mitra — SATRIA GO</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20232a;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}.top{background:#a90f1d;color:white;padding:18px 16px}.top b{font-size:20px}.top small{display:block;opacity:.85}.wrap{max-width:900px;margin:22px auto;padding:0 14px}.panel,.item{background:#fff;border:1px solid #e4e6eb;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #1111}h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.5}.muted{color:#687080;font-size:13px}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cfd3da;border-radius:9px;font:inherit;background:#fff}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;font:inherit;cursor:pointer}.primary{background:#b51220;color:#fff}.secondary{background:#edf0f4;color:#222}.danger{background:#ffe8e9;color:#9d101b}.success{background:#e2f5e8;color:#176b35}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.pill{font-size:12px;padding:4px 8px;border-radius:20px;background:#fff0d8;color:#855100}.detail{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f8fa;padding:12px;border-radius:9px;font-size:13px;max-height:360px;overflow:auto}.status{margin:12px 0;padding:10px;border-radius:8px;background:#f0f2f5}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button.active{background:#222;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{margin:14px auto}}
</style>
</head><body>
<header class="top"><b>SATRIA GO</b><small>ADMIN • VERIFIKASI PENGAJUAN MITRA</small></header>
<main class="wrap">
<section class="panel" id="loginPanel"><h1>Masuk Admin</h1><p class="muted">Gunakan email dan kata sandi akun admin Supabase yang sudah terdaftar di tabel admin_users.</p>
<label for="email">Email admin</label><input id="email" type="email" autocomplete="username" placeholder="email admin" required>
<label for="password">Kata sandi</label><input id="password" type="password" autocomplete="current-password" placeholder="Kata sandi" required>
<div class="actions"><button class="primary" id="loginBtn">Masuk</button></div><div class="status" id="loginMsg" role="status">Silakan masuk.</div></section>
<section id="dashboard" class="hidden">
<div class="panel"><div class="itemhead"><div><h1>Pengajuan Mitra</h1><p class="muted">Hanya akun yang terdaftar di admin_users yang dapat melihat dan memproses pengajuan.</p></div><button class="secondary" id="logoutBtn">Keluar</button></div>
<div class="filters" id="filters"><button class="active secondary" data-status="pending">Menunggu</button><button class="secondary" data-status="revision_requested">Perbaikan</button><button class="secondary" data-status="approved">Disetujui</button><button class="secondary" data-status="rejected">Ditolak</button><button class="secondary" data-status="all">Semua</button></div>
<div class="status" id="listMsg" role="status">Memuat pengajuan…</div></div><div id="list"></div>
</section>
</main>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
 const cfg=window.SATRIA_GO_CONFIG;
 const $=id=>document.getElementById(id);
 const loginPanel=$('loginPanel'),dashboard=$('dashboard'),loginMsg=$('loginMsg'),listMsg=$('listMsg'),list=$('list');
 if(!cfg||!window.supabase){loginMsg.textContent='Konfigurasi Supabase atau library belum termuat.';return;}
 const client=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey);
 let currentStatus='pending';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function showSession(ok){loginPanel.classList.toggle('hidden',ok);dashboard.classList.toggle('hidden',!ok);}
 async function checkSession(){const {data}=await client.auth.getSession();showSession(!!data.session);if(data.session)loadApplications();}
 $('loginBtn').addEventListener('click',async()=>{loginMsg.textContent='Memeriksa akun…';const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){loginMsg.textContent='Gagal masuk: '+error.message;return;}showSession(true);await loadApplications();});
 $('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();showSession(false);loginMsg.textContent='Anda sudah keluar.';});
 $('filters').addEventListener('click',async e=>{const b=e.target.closest('button[data-status]');if(!b)return;currentStatus=b.dataset.status;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));await loadApplications();});
 async function loadApplications(){listMsg.textContent='Memuat pengajuan…';list.innerHTML='';const {data,error}=await client.rpc('get_satria_go_applications',{p_status:currentStatus});if(error){listMsg.textContent='Tidak dapat memuat: '+error.message;return;}const rows=Array.isArray(data)?data:[];listMsg.textContent=rows.length?`Ditemukan ${rows.length} pengajuan.`:'Belum ada pengajuan pada kategori ini.';rows.forEach(renderItem);}
 function renderItem(a){const el=document.createElement('article');el.className='item';const d=a.data_pengajuan||{};const services=Array.isArray(d.services)?d.services.map(x=>x.nama||('ID '+x.service_id)).join(', '):'-';const loc=d.lokasi||{};const date=a.submitted_at?new Date(a.submitted_at).toLocaleString('id-ID'):'-';let mapLink='-';try{const u=new URL(loc.maps_url);if(u.protocol==='https:')mapLink=`<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">Buka tautan</a>`;}catch{}el.innerHTML=`<div class="itemhead"><div><h2>${esc(a.nama||'Anggota tanpa nama')}</h2><div class="muted">ID Anggota: ${esc(a.anggota_id)} • Pengajuan #${esc(a.id)}</div></div><span class="pill">${esc(a.status)}</span></div><p><b>Kota:</b> ${esc(a.kota_anggota||d.lokasi?.kota||'-')}<br><b>WhatsApp:</b> ${esc(a.whatsapp||'-')}<br><b>Dikirim:</b> ${esc(date)}</p><p><b>Layanan dipilih:</b> ${esc(services)}<br><b>Rentang tarif:</b> ${esc(d.tarif_min??'-')} – ${esc(d.tarif_max??'-')}<br><b>Durasi:</b> ${esc(d.durasi_min_menit??'-')} – ${esc(d.durasi_max_menit??'-')} menit<br><b>Lokasi praktik:</b> ${esc([loc.nama_tempat,loc.alamat,loc.kota].filter(Boolean).join(', ')||'-')}<br><b>Google Maps:</b> ${mapLink}</p><details><summary>Lihat seluruh data pengajuan</summary><pre class="detail">${esc(JSON.stringify(d,null,2))}</pre></details><label>Catatan admin</label><textarea rows="2" class="note" placeholder="Catatan untuk anggota (opsional)">${esc(a.catatan_admin||'')}</textarea><div class="actions"></div>`;
 const actions=el.querySelector('.actions');
 if(a.status==='pending'||a.status==='revision_requested'){
  const approve=button('Setujui','success',()=>review(a.id,'approved',el));
  const revise=button('Minta Perbaikan','secondary',()=>review(a.id,'revision_requested',el));
  const reject=button('Tolak','danger',()=>review(a.id,'rejected',el));
  actions.append(approve,revise,reject);
 }
 list.append(el);
 }
 function button(label,cls,fn){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b;}
 async function review(id,action,el){const note=el.querySelector('.note').value.trim();const label=action==='approved'?'menyetujui':action==='rejected'?'menolak':'meminta perbaikan untuk';if(!confirm(`Yakin ${label} pengajuan #${id}?`))return;const btns=el.querySelectorAll('button');btns.forEach(b=>b.disabled=true);const {data,error}=await client.rpc('review_satria_go_application',{p_application_id:id,p_action:action,p_catatan_admin:note||null});if(error){alert('Gagal memproses: '+error.message);btns.forEach(b=>b.disabled=false);return;}alert(data?.message||'Pengajuan berhasil diproses.');await loadApplications();}
 client.auth.onAuthStateChange((_event,session)=>{if(!session)showSession(false);});
 checkSession();
})();
</script>
</body></html>
